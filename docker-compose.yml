services:
  logicaproxy:
    image: ${LOGICAPROXY_IMAGE:-rovemark/logicaproxy:latest}
    pull_policy: always
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: logicaproxy
    # env_file:
    #   - .env
    environment:
      DEPLOY: ${DEPLOY:-}
    ports:
      - "8317:8317"
      - "8085:8085"
      - "1455:1455"
      - "54545:54545"
      - "51121:51121"
      - "11451:11451"
    volumes:
      - ${LOGICAPROXY_CONFIG_PATH:-./config.yaml}:/LogicaProxy/config.yaml
      - ${LOGICAPROXY_AUTH_PATH:-./auths}:/root/.logicaproxy
      - ${LOGICAPROXY_LOG_PATH:-./logs}:/LogicaProxy/logs
    restart: unless-stopped
