name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o logicaproxy ./cmd/server

      - name: Test
        run: go test ./... -short -count=1 -timeout 120s
        continue-on-error: true

      - name: Verify binary
        run: ./logicaproxy --help 2>&1 | head -3
